# EI-core electromagnetic linear actuator task configuration.
# Values are aligned with the Supplementary Information for the submitted paper.

task_name: "EI-core electromagnetic linear actuator optimisation"
domain: "electromagnetic_actuator"

parameters:
  - name: "lm"
    category: "length"
    role: "magnetic"
    range: [0.0, 6.0]
    unit: "mm"
    description: "Permanent-magnet length"
  
  - name: "tm"
    category: "length"
    role: "magnetic"
    range: [0.3, 0.5]
    unit: "mm"
    description: "Permanent-magnet thickness"
  
  - name: "ta"
    category: "length"
    role: "magnetic"
    range: [0.35, 0.65]
    unit: "mm"
    description: "Arm/yoke thickness"

  - name: "dg"
    category: "gap"
    role: "clearance"
    range: [0.30, 0.65]
    unit: "mm"
    description: "Air-gap height"
  
  - name: "s"
    category: "length"
    role: "stroke"
    range: [0.8, 1.2]
    unit: "mm"
    description: "Actuator stroke"
  
  - name: "hs"
    category: "length"
    role: "winding"
    range: [1.2, 2.2]
    unit: "mm"
    description: "Slot outer height"
  
  - name: "wslot"
    category: "length"
    role: "winding"
    range: [2.0, 2.8]
    unit: "mm"
    description: "Slot width"
  
  - name: "hslot"
    category: "length"
    role: "winding"
    range: [0.8, 1.3]
    unit: "mm"
    description: "Slot inner height"
  
  - name: "tb_ratio"
    category: "ratio"
    role: "bridge_to_yoke_ratio"
    range: [1.5, 2.0]
    unit: "dimensionless"
    description: "Bridge-to-yoke thickness ratio"

constraints:
  - type: "geometric"
    description: "Pre-simulation geometry and package checks"
  
  - type: "magnetic"
    description: "Post-simulation magnetic-saturation diagnostics"
  
  - type: "manufacturing"
    description: "Minimum stroke, clearance, winding-space and package constraints"

objectives:
  - name: "volume"
    direction: "minimize"
    weight: 0.5
    description: "Actuator volume term in the reference-normalised score"

  - name: "mass"
    direction: "minimize"
    weight: 0.5
    description: "Actuator mass term in the reference-normalised score"

  - name: "kb"
    direction: "maximize"
    weight: 4.0
    description: "Force constant term in the reference-normalised score"
  
  - name: "pb"
    direction: "maximize"
    weight: 1.0
    description: "Relative actuator dynamic-output metric"

derived_quantities:
  - name: "twall"
    formula: "(hs - hslot) / 2"
    unit: "mm"
    description: "Slot-wall thickness used in deterministic constraints"
  - name: "tb"
    formula: "clip(tb_ratio * ta, 1.5 * ta, 2.0 * ta)"
    unit: "mm"
    description: "Bridge thickness"
  - name: "n2"
    formula: "0.9 * twall / wcoil"
    unit: "dimensionless"
    description: "Derived winding-layer capacity, with wcoil = 0.05 mm"

